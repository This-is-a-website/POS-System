<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Blue Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0b0f19;
        }

        .calculator {
            width: 320px;
            background-color: #121824;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .display {
            width: 100%;
            height: 80px;
            background-color: #1a2333;
            border-radius: 16px;
            margin-bottom: 20px;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            border: 1px solid rgba(0, 119, 255, 0.2);
        }

        .expression {
            font-size: 0.9rem;
            color: #5f7594;
            min-height: 1.2rem;
            word-wrap: break-word;
            word-break: break-all;
            text-align: right;
            width: 100%;
            margin-bottom: 4px;
        }

        .current-value {
            font-size: 2rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 15fr);
            gap: 12px;
        }

        button {
            border: none;
            outline: none;
            height: 60px;
            border-radius: 14px;
            font-size: 1.4rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Number buttons */
        .btn-num {
            background-color: #1e293b;
            color: #cbd5e1;
        }

        .btn-num:hover {
            background-color: #2c3e59;
        }

        /* Operator buttons */
        .btn-op {
            background-color: #0052cc;
            color: #ffffff;
            font-size: 1.6rem;
        }

        .btn-op:hover {
            background-color: #0066ff;
        }

        /* Clear text button */
        .btn-clear {
            grid-column: span 2;
            background-color: #334155;
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-clear:hover {
            background-color: #475569;
            color: #f1f5f9;
        }

        /* Equals button */
        .btn-equal {
            background-color: #0077ff;
            color: #ffffff;
            font-size: 1.8rem;
            box-shadow: 0 4px 12px rgba(0, 119, 255, 0.3);
        }

        .btn-equal:hover {
            background-color: #3399ff;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="current-value" id="display">0</div>
        </div>
        <div class="grid">
            <!-- Row 1 -->
            <button class="btn-clear" onclick="clearAll()">CLEAR</button>
            <button class="btn-op" onclick="appendOperator('/')">÷</button>
            <button class="btn-op" onclick="appendOperator('*')">×</button>

            <!-- Row 2 -->
            <button class="btn-num" onclick="appendNumber('7')">7</button>
            <button class="btn-num" onclick="appendNumber('8')">8</button>
            <button class="btn-num" onclick="appendNumber('9')">9</button>
            <button class="btn-op" onclick="appendOperator('-')">-</button>

            <!-- Row 3 -->
            <button class="btn-num" onclick="appendNumber('4')">4</button>
            <button class="btn-num" onclick="appendNumber('5')">5</button>
            <button class="btn-num" onclick="appendNumber('6')">6</button>
            <button class="btn-op" onclick="appendOperator('+')">+</button>

            <!-- Row 4 -->
            <button class="btn-num" onclick="appendNumber('1')">1</button>
            <button class="btn-num" onclick="appendNumber('2')">2</button>
            <button class="btn-num" onclick="appendNumber('3')">3</button>
            <button class="btn-equal" grid-row="span 2" onclick="calculate()">=</button>

            <!-- Row 5 -->
            <button class="btn-num" style="grid-column: span 2;" onclick="appendNumber('0')">0</button>
            <button class="btn-num" onclick="appendNumber('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const expressionDisplay = document.getElementById('expression');
        
        let currentInput = '0';
        let runningExpression = '';
        let resetOnNextInput = false;

        function updateDisplay() {
            display.innerText = currentInput;
            
            // Format math symbols nicely for the visual running string
            let formattedExpr = runningExpression
                .replace(/\*/g, ' × ')
                .replace(/\//g, ' ÷ ')
                .replace(/\+/g, ' + ')
                .replace(/-/g, ' - ');
            
            expressionDisplay.innerText = formattedExpr;
        }

        function appendNumber(num) {
            if (resetOnNextInput) {
                currentInput = '';
                resetOnNextInput = false;
            }
            
            if (num === '.' && currentInput.includes('.')) return;
            
            if (currentInput === '0' && num !== '.') {
                currentInput = num;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (resetOnNextInput) {
                runningExpression = currentInput;
                resetOnNextInput = false;
            } else if (currentInput !== '') {
                runningExpression += currentInput;
            }

            // If last character is an operator, swap it out
            const lastChar = runningExpression.trim().slice(-1);
            if (['+', '-', '*', '/'].includes(lastChar) && currentInput === '') {
                runningExpression = runningExpression.slice(0, -1) + op;
            } else {
                runningExpression += op;
            }

            currentInput = '';
            updateDisplay();
        }

        function calculate() {
            if (currentInput !== '') {
                runningExpression += currentInput;
            }

            // Remove trailing operator if user hits equals immediately after an operator
            const lastChar = runningExpression.trim().slice(-1);
            if (['+', '-', '*', '/'].includes(lastChar)) {
                runningExpression = runningExpression.slice(0, -1);
            }

            if (!runningExpression) return;

            try {
                // Safely evaluate the running math string
                let result = Function('"use strict";return (' + runningExpression + ')')();
                
                // Handle floating point decimals gracefully
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(8));
                }
                
                currentInput = result.toString();
                runningExpression = '';
                resetOnNextInput = true;
            } catch (error) {
                currentInput = 'Error';
                runningExpression = '';
                resetOnNextInput = true;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            runningExpression = '';
            resetOnNextInput = false;
            updateDisplay();
        }
    </script>
</body>
</html>
